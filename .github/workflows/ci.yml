name: CI

# Gate for the BWN userscripts repo. This is a NO-BUILD, NO-npm project: the
# userscripts pull their runtime deps via Tampermonkey @require/@resource from CDNs,
# so there is no package.json, lockfile, or `npm ci`/`npm run build` step to run.
# CI runs the bespoke node harnesses in scripts/ plus a `node --check` syntax gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # test-domproj-parity.js compares Core's pasted BWN-DOM / BWN-DOMC blocks against their source
      # in the SIBLING repo Intermu/broadway-internal-ops, and exits NON-ZERO when that checkout is
      # absent (a parity test that can only see one of the two sides is worse than none). The default
      # GITHUB_TOKEN is scoped to THIS repo only, so a PAT with read access to broadway-internal-ops
      # must be stored as the BWN_OPS_REPO_TOKEN secret. The parity step below sets BWN_OPS_REPO to
      # this path — the harness's relative-path fallback resolves outside the Actions workspace.
      # TEMPORARY (2026-08-10): advisory until BWN_OPS_REPO_TOKEN grants read on the private ops repo.
      # continue-on-error lets the rest of the job run and gate even while this cross-repo checkout
      # 403s; the parity step below is advisory for the same reason. Flip BOTH back to blocking (remove
      # the two continue-on-error lines) once the token works.
      - name: Checkout broadway-internal-ops (sibling repo, for the DOM-protocol parity check)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: Intermu/broadway-internal-ops
          ref: main
          path: broadway-internal-ops
          token: ${{ secrets.BWN_OPS_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # No `cache: npm` — there is no lockfile to key the cache on.

      - name: Syntax check userscripts (node --check)
        run: |
          for f in *.user.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: AI client transport harness (TEST-003)
        run: node scripts/test-bwn-ai-client.js

      - name: AI Phase 3 consumer-migration harness (PAT-002 SHA gate)
        # Enforces PAT-002: the bwnAI TRANSPORT block must be SHA-identical across
        # bwn-drop-upload / bwn-suite-ai / bwn-wo-audit. Makes that a real gate.
        run: node scripts/test-bwn-ai-phase3.js

      # The four steps below close the 2026-07-31 audit finding that harnesses were
      # committed but NEVER EXECUTED by CI - a green checkmark said nothing about them.
      - name: Launcher dock latent-fix harness
        run: node scripts/test-dock-latent-fixes.js

      - name: W-9 TIN region harness
        run: node scripts/test-w9-tin-region.js

      - name: WO Audit accounting harness
        run: node scripts/test-wo-audit-accounting.js

      - name: WO Audit retry-floor harness
        run: node scripts/test-wo-audit-retry-floor.js

      - name: Bid-out dock registration + ACT_TOOL harness
        run: node scripts/test-bidout-dock.js

      # Cross-script: Drop Upload has no egress, so the client-response item only exists if the
      # bwn:assist:track / :tracked handshake holds. Nothing else checks across those two files.
      - name: Client-response track handshake + convergence harness
        run: node scripts/test-assist-client-response.js

      - name: assist:due severity handoff harness
        run: node scripts/test-assist-due.js

      - name: PO act re-key harness (sid keys + migration)
        run: node scripts/test-po-act-keys.js

      - name: vendor-intake flow-guard harness (cross-vendor leak)
        run: node scripts/test-vendor-intake-flow.js

      - name: assist state round-trip harness (queue-spec step 3)
        run: node scripts/test-assist-roundtrip.js

      - name: dispatch payload harness (WO number + site number)
        run: node scripts/test-dispatch-payload.js

      # bwn-dispatch 0.10.0 writes the WO record directly via patchWorkOrder (the mutation kanban
      # proved writes status LIVE), adding assign + ECD. Every shape was captured off real SPA edits
      # 2026-08-12. Slices the shipped engine block and pins: the Conditional{shouldInclude,value}
      # wrapper, status coerced to Int, assign GUID, and the ECD whole-object COPY that overrides only
      # expectedCompletionDate + forces hasOverridePriority:true and NEVER blanks a sibling priority
      # field (the captured hazard), plus patchWorkOrder throwing on success:false so a failed write
      # aborts before any card is sent. Seven controls each turn it red.
      - name: dispatch patchWorkOrder engine harness (status/assign/ECD writes)
        run: node scripts/test-dispatch-patch.js

      - name: bus identity publish harness (identity ahead of the anchor gate)
        run: node scripts/test-bus-identity-publish.js

      # List Heat v3.18: the capture that never latched (response reads lose a race with the
      # app's own abort) and the PageInput paging arg the replay used to overwrite with a number.
      - name: List Heat API scan harness (capture + PageInput paging)
        run: node scripts/test-heat-api-scan.js

      # List Heat v3.22: which rows count as OPEN. A 218-row board every one of whose rows was
      # phase "Open" reported "of 199 open" - the status-name regex matched the word "Complete"
      # in "Clocked Out: Complete" and muted 19 live rows in five counts at once.
      - name: List Heat open-count harness (phase beats the status name)
        run: node scripts/test-heat-open-count.js

      # List Heat 1.78.6: the API scan needs a captured PagedWorkOrders query, but capture is a
      # passive race the document-start hook can lose - leaving 'no capture yet' for the page's
      # life. Core now seeds apiList with the pinned board query (captured off the wire 2026-08-13)
      # so the scan runs regardless. Slices the seed block + heatRecordCapture and pins: the two
      # REQUIRED non-null args are present, the seed pages+gates like a live capture, and the seed
      # is always DISPLACED by a real board request (never blocks it) while non-seeds stay protected.
      - name: List Heat seed-fallback harness (pinned board query + displaceable seed)
        run: node scripts/test-heat-seed.js

      # Notes without scraping: workOrderNotes in one call, plus the SHA gate that keeps
      # the block identical in bwn-suite-core and bwn-suite-ai.
      - name: Notes API harness (bwnNotesApi block + cross-file SHA)
        run: node scripts/test-notes-api.js

      # bwn-kanban 0.4.0: the board card rendered timeInStatus (MINUTES) as hours, 60x on every
      # card of a 219-row board. Also gates the List Heat v3.24 full-board verdict publish the
      # board reads its severity from, and that both bwn:heat writers emit one payload shape.
      - name: Kanban card harness (status-clock units + verdict publish)
        run: node scripts/test-kanban-card.js

      # Docs-verify via jobDocuments: the DOM reader returned null on every real WO, so the
      # docs:none closure gate never fired. Pins unknown-vs-confident-empty (a failed read
      # must NEVER read as "no documents") and the workOrderNumber-not-jobId key. Also the
      # tripwire for the route going missing again: the slices throw if it is not in source.
      - name: Docs API harness (jobDocuments reader + docs:none gate)
        run: node scripts/test-docs-api.js

      # drop-upload 1.11.0 writes notes + documents via Umbrava's own mutations
      # (addEditJobNote; initializeJobDocument -> blob PUT -> bulkAddWorkOrderDocuments),
      # captured live 2026-08-12, replacing the brittle combobox DOM automation. Slices the
      # shipped API block and pins the captured op/arg/id shapes (note-type + doc-label ids)
      # against a fake fetch, and that every write REJECTS (so the DOM fallback fires) on no
      # token / errors[] / success:false / non-2xx blob PUT. Tripwire if the block regresses.
      - name: Drop Upload API harness (note + document write mutations)
        run: node scripts/test-drop-upload-api.js

      # Views v2.0 applies column presets through Umbrava's own putUserPreference instead
      # of chooser-checkbox choreography. Pins the measured contract: the 30-column
      # title->id map (incl. the "Label"=workOrderCategory trap), version ECHOED never
      # hardcoded, {success message}-only write selection, null-read -> loud DOM fallback
      # with no write, and the reload continuation consumed before applying.
      - name: Views API harness (putUserPreference column apply)
        run: node scripts/test-views-api.js

      # The AI drafts' trips read was a guessed query that failed validation four ways and
      # was swallowed to []: every draft ever written had zero trips and zero PO vendors.
      # Validates the shipped query strings against a RECORDED schema rather than a stub
      # (a stub agrees with the code by construction - that is how this shipped dead), plus
      # read isolation and the warn-on-failure that stops an empty list meaning "broken".
      - name: AI trips-read harness (query vs measured schema + read isolation)
        run: node scripts/test-ai-trips-read.js

      # The AI drafts' coordinator read was dead the same way: assignedToMemberName is not
      # a WorkOrder field, so every draft attributed its next actions to nobody. Pins the
      # assignedTo -> user(id:) two-step against the schema (incl. the ID! typing), the
      # Team-name filter, and warn-on-failure.
      - name: AI coordinator-read harness (assignedTo + user(id:) two-step)
        run: node scripts/test-ai-coordinator-read.js

      # next-actions-overhaul: the priority clock, intake gate and tiered escalation were
      # all shipped in WO Assist 2.68 but had no dedicated harness for their decision
      # logic. These slice the real engine blocks and pin the math, so a drift fails CI
      # instead of quietly mis-judging a WO. The ECD-notes harness had existed in scripts/
      # since it was written but was never wired here, so it rotted unrun.
      - name: Next Actions priority-clock + escalate-math harness
        run: node scripts/test-assist-priority-clock.js

      - name: Next Actions intake actionability gate harness
        run: node scripts/test-assist-intake-gate.js

      - name: Next Actions tiered role-aware escalation mapping harness
        run: node scripts/test-assist-escalation-tier.js

      - name: ECD auto-warm x auto-pop x proposal harness (was orphaned from CI)
        run: node scripts/test-assist-ecd-notes.js

      - name: Header-anchor mount harness (tripCal + AI jobView, was orphaned from CI)
        run: node scripts/test-anchor-mounts.js

      # next-actions-overhaul closure gap: docs-present -> advance to Work Complete, so jobs
      # do not rot in confirm-complete. Mirror of docs:none; a suggestion, never auto-advances.
      - name: Next Actions closure auto-advance harness (WO Assist 2.69)
        run: node scripts/test-assist-advance-gate.js

      # UI-contract completeness ledger: names every bwn-*.user.js and forces each into a classified
      # row per shared UI contract (drawer exit / toast motion / reduced-motion / rail anchor), tied
      # to test-drawer-motion.js so neither harness can quietly omit a script. Green == the recorded
      # 2026-08-10 scope; red == a script silently grew, dropped, or regressed a shared primitive.
      # Closes the "quietly dropped" gap the animation review left when its fixes landed unevenly.
      - name: UI-contract completeness ledger harness
        run: node scripts/test-ui-contract-ledger.js

      # These six harnesses were committed to scripts/ but never wired here, so CI ran a green check
      # that said nothing about them — the exact "committed but never executed" rot the 2026-07-31
      # audit closed for the four steps near the top. All six pass a local sweep; wired here so a
      # regression fails CI instead of waiting for someone to run node by hand.

      # Tonight's animation review, made behavioural: RUNS each drawer module's drawerDismiss() and
      # the real publishDockWidth in a vm under both media states — exit path, rail geometry, and the
      # .bwn-ops-card reduced-motion gap — rather than grepping for the fix. Pairs with the ledger above.
      - name: Drawer + toast motion behavioural harness (Core 1.78.0 animation review)
        run: node scripts/test-drawer-motion.js

      # BWN Ask reaches the page tools and reports failure instead of eating it. Pins Ask's tool
      # definitions byte-identical to bwn-suite-ai (one model, one truth about the three verbs) and
      # drives the sliced tool loop: /api/ai not /api/ask, fresh token per round, round cap, status stamp.
      - name: BWN Ask page-tools + tool-loop harness (route + def parity)
        run: node scripts/test-ask-tools.js

      # The phase-4 DOM bus contract driven end to end with BOTH real halves — Core's responder and
      # suite-ai's client/tools sliced from shipped bytes. rid correlation, timeout-never-hangs, the
      # write-verb gate AT THE BUS, listener cleanup on both paths, NO_RESPONDER named not timed out.
      - name: DOM handle bus harness (phase-4 request/response contract)
        run: node scripts/test-domp-bus.js

      # The two shared DOM-protocol blocks (BWN-DOM / BWN-DOMC) are PASTE-IDENTICAL across this repo
      # and Intermu/broadway-internal-ops — a paste has no mechanism behind it, so two copies drift.
      # Needs the sibling checkout above; BWN_OPS_REPO points the harness at it (the relative fallback
      # lands outside the workspace). Exits non-zero rather than skipping if the source is unreachable.
      - name: DOM-protocol parity harness (Core paste vs broadway-internal-ops source)
        continue-on-error: true   # TEMPORARY (2026-08-10): advisory until the ops checkout above succeeds
        env:
          BWN_OPS_REPO: ${{ github.workspace }}/broadway-internal-ops
        run: node scripts/test-domproj-parity.js

      # The board -> Dashboard dataset producer (heatDatasetRows), sliced from Core and run in a vm.
      # Pins the heat-record -> wire-row map, UNITS pass through unchanged (no re-introduced 60x/100x),
      # "(unresolved member)" never sent as a coordinator, and the cross-file key contract with the SWA route.
      - name: Heat dataset push harness (board -> Dashboard producer + wire-key contract)
        run: node scripts/test-heat-dataset-push.js

      # The In-House Dispatch Report feed: the tenant-open -> bwn:dispatchq producer. Pins the
      # heat-record -> dispatch wire-row map, that CITY + STATE ride the row (the report's coverage
      # key), the vendorsKnown gate (unread != "no vendor"), coordinator GUID/placeholder skips, and
      # the identity-drop + row cap. Negative controls revert each guarantee.
      - name: Dispatch dataset harness (In-House Dispatch Report feed producer)
        run: node scripts/test-dispatch-dataset.js

      # Canned dispatch-note templates: the 3 groups / 9 templates are intact, first name resolves
      # from given_name then the display-name token, the signature is appended to signed templates
      # only (blank when unresolved), and NO body bakes in a name. Negative control reverts the gate.
      - name: Note templates harness (canned dispatch notes + dynamic signature)
        run: node scripts/test-notes-templates.js

      # B.1 shared field map: scripts/field-map.json is a byte-identical mirror of the CANONICAL
      # copy in the SWA repo (api/shared/field-map.json). Asserts Core's board producer emits only
      # wire keys the map declares with the "board" producer, so the userscript<->SWA vocabulary
      # can no longer drift silently (store-key-two-writers-drift, getfield-alias-orphan).
      - name: Field-map conformance harness (board producer keys vs shared map)
        run: node scripts/test-field-map-conformance.js

      # Track A docs-closure: Core publishes the confident jobDocuments count to bwn:docs:<wo>
      # (confident reads only - unknown stays absent), AI's pushJobFacts carries it as docCount
      # to the live-jobs slot, the Dashboard surfaces "Docs on file". Runs the shipped lookup bytes.
      - name: Docs-ingest harness (bwn:docs publish + docCount carry)
        run: node scripts/test-docs-ingest.js

      # Track A trips/no-show: Core (fetchTrips) computes the earliest missed-onsite no-show into
      # bwn:trips:<wo>; AI's pushJobFacts carries it as noShowDays + noShowVendor (12h TTL) to the
      # live-jobs slot, the Dashboard shows a red "No-show" modal row. Runs the shipped lookup bytes.
      - name: Trips no-show ingest harness (bwn:trips read + noShow carry)
        run: node scripts/test-trips-ingest.js

      # Track A proposals+GP: GP% from Core's bwn:wo bus (real grossProfitInfo, AI-only); open
      # client-proposal count from Core fetchProposals -> bwn:props (proposals with no terminal date).
      # AI's pushJobFacts carries gpPct + openProposals; the Dashboard prefers the live GP% and shows
      # an "Open proposals" row. Runs the shipped AI lookup + Core's open-classification filter.
      - name: GP + proposals ingest harness (bus gpPct + listClientProposals open-count)
        run: node scripts/test-gp-proposals-ingest.js

      # Track A notes-history: noteCount + client-note staleness ride the same bwn:wo bus read as
      # gpPct (Core publishes state.noteCount + lastClientNote). AI carries noteCount + clientNoteDays
      # (client silence, distinct from the board's any-note lastNoteDate). Runs the shipped bus block.
      - name: Notes-history ingest harness (bus noteCount + clientNoteDays)
        run: node scripts/test-notes-hist-ingest.js

      # Track A tasks: Core fetchTasks (tasksByEntityTypeAndId, entityType 1) counts INCOMPLETE tasks
      # into bwn:tasks - the deterministic API count replacing the fragile DOM "Open Tasks N" scrape.
      # AI carries openTasks; the Dashboard shows an "Open tasks" row. Runs the shipped AI lookup +
      # Core's incomplete-count filter.
      - name: Tasks ingest harness (fetchTasks open-count + carry)
        run: node scripts/test-tasks-ingest.js

      # Track A IVR hours: Core extends the jobIVRs read it already does for the no-show check to sum
      # labor + travel hours (non-canceled) into the bwn:trips payload; AI carries laborHours +
      # travelHours. Hours only when the jobIVRs read succeeded (unknown stays absent). Runs the
      # shipped AI extraction + Core's hours-sum.
      - name: IVR hours ingest harness (jobIVRs labor/travel sum + carry)
        run: node scripts/test-ivr-ingest.js

      # The Operate panel — the seam an agent drives the page from, the code path that once had page
      # tools registered where no coordinator-facing UI invoked them. Sliced from bwn-suite-ai: panel
      # unprojectable, capability line derived, posts `operate` never `ask`, adopts the SERVER's round
      # cap, keeps a failure's status AND body, Stop halts before the next round.
      - name: Operate surface harness (agent drive seam + loop contract)
        run: node scripts/test-operate-surface.js

      # Proposal Copy copies a client proposal onto another WO as an un-submitted Draft by replaying
      # createDraftProposal + editProposal (line items batch-embedded, verbatim). Live-gated 2026-08-14
      # (real copy #517386 on W-371126 -> new draft #540165 on W-386771). Slices the copy engine and pins:
      # mapLineItem omits id + coerces the read's STRING quantity/chargeQuantity to Int (server rejects the
      # string) + copies money verbatim; buildCreateVars sends jobId + location.address (both server-required
      # though nullable in the schema); the two-mutation replay order; dry-run sends ZERO writes; null=failure
      # preflight; stop-at-first-mutation-failure; read-back count+subtotal+client-PO; the pure picker/confirm
      # helpers. Negative controls (mutate()) turn it red. 60 assertions.
      - name: Proposal Copy engine harness (createDraftProposal + editProposal replay)
        run: node scripts/test-proposal-copy.js

      # Track C write-back DRAIN half (bwn-write-queue.user.js): the coordinator's-tab executor that
      # claims a queued command from /api/wo-write-queue, confirms it, and turns it into a real
      # patchWorkOrder / addEditJobNote write. Slices the exec block into a vm with an injected gql and
      # pins: set verbs (status/assign/ECD) skip when current==target (no needless clock reset); ECD does
      # the whole-priority read-copy-override (never blanks a sibling); the append verb embeds a
      # [bwn:<idemKey>] marker and reads workOrderNotes for it BEFORE posting; a business error is
      # non-retryable while a transport error is retryable. The append dedup carries a negative control -
      # disabling the marker check double-posts, RED. 40 assertions.
      - name: "Write-queue drain harness (Track C executor: patchWorkOrder/addEditJobNote + idempotency)"
        run: node scripts/test-write-queue-drain.js

      # Track C write-back phase 2: the catalog pusher in bwn-write-queue.user.js. Reads the tenant
      # status list + user directory and pushes them to /api/catalog-ingest so the Dashboard's write-back
      # Status/Assign pickers have real options. Slices the pure mappers (status id coerced to int; a
      # user's first+last -> name, inactive dropped) and pins the queries, the route, the version bump,
      # and that the push runs on load independent of draining (throttled). Inactive-drop negative control.
      - name: Write-queue catalog push harness (status + user catalog ingest)
        run: node scripts/test-wq-catalog-push.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Hard gate (was advisory until 2026-08-14). eslint.config.mjs now enumerates the injected
    # host/app globals (XLSX, Tesseract, pdfjsLib, the DOM event constructors, LanguageModel, ...)
    # and allows the intentional parenthesized assignment-in-condition idiom
    # (no-cond-assign: except-parens), so the userscripts + harnesses lint with zero errors. A new
    # undefined global or a real cond-assign now fails CI. Two files still carry a blanket
    # /* eslint-disable */ and emit an advisory unused-directive WARNING, which does NOT fail the
    # run (no --max-warnings is set); the gate blocks on ERRORS only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: ESLint (flat config; npx fetches eslint, no install needed)
        run: npx --yes eslint@9 "*.user.js" "scripts/**/*.js"
